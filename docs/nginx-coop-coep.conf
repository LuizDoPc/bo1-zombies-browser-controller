# For https://your.domain/bo1z/ served directly by nginx from the extracted tarball.
# Put this inside the server { } block for your.domain, replacing any other "location /bo1z" block.
# Set the alias to the folder that holds index.html (the extracted bo1z-static/). Keep the trailing slashes.
# "^~" stops regex locations (e.g. "location ~* \.(js|css)$") from taking over these files.
# The types block is the full list for this folder: nginx's stock mime.types has no .mjs, and browsers refuse to
# load the engine module (artifacts/KisakBlack-web.mjs) as application/octet-stream.

        location ^~ /bo1z/ {
                alias /PATH/TO/bo1z-static/;
                add_header Cross-Origin-Opener-Policy  same-origin  always;
                add_header Cross-Origin-Embedder-Policy require-corp always;
                # browsers recheck files on every load (a cheap 304 when unchanged), so an update never mixes old and new code
                add_header Cache-Control no-cache always;
                # serve the precompressed .gz copies the static build writes (shader warm-up lists: 22 MB -> 3.4 MB for Kino),
                # and compress the rest of the code on the fly
                gzip_static on;
                gzip on;
                gzip_types application/json application/wasm text/javascript;
                types {
                        text/html                 html;
                        text/css                  css;
                        text/javascript           js mjs;
                        application/json          json;
                        application/wasm          wasm;
                        image/webp                webp;
                        image/png                 png;
                        application/manifest+json webmanifest;
                        video/webm                webm;
                        text/plain                txt;
                }
                default_type application/octet-stream;
        }

# Then: sudo nginx -t && sudo nginx -s reload
# Check (both cross-origin lines should print, and the .mjs should say text/javascript):
# curl -sI https://your.domain/bo1z/ | grep -i cross-origin
# curl -sI https://your.domain/bo1z/artifacts/KisakBlack-web.mjs | grep -i content-type
#
# Find what currently serves /bo1z/ (and any other add_header lines that might be overriding):
# sudo nginx -T 2>/dev/null | grep -n -B8 -A12 'bo1z\|Cross-Origin'
